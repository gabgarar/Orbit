services:
  orbit:
    build:
      context: .
    ports:
      # Keep the gateway private to this machine unless exposure is deliberate.
      # Set ORBIT_HTTP_BIND=0.0.0.0 to publish it on every network interface.
      - "${ORBIT_HTTP_BIND:-127.0.0.1}:${ORBIT_HTTP_PORT:-8100}:8100"
    environment:
      # The HTTP port inside the container is part of the runtime contract.
      PORT: "8100"
      PYTHON_BACKEND_URL: "http://127.0.0.1:8765"
      # Strict SP3/ERP rehydration is local but can take longer than a normal
      # web-service boot. The runtime only accepts 10,000–600,000 ms.
      ORBIT_PYTHON_STARTUP_TIMEOUT_MS: "${ORBIT_PYTHON_STARTUP_TIMEOUT_MS:-180000}"
      # Manual numerical calculations keep the complete requested window by
      # default. Set 30,000–600,000 to opt into a deployment deadline; 0
      # disables it and lets the operator cancel from the activity panel.
      ORBIT_NUMERICAL_ORBIT_PROXY_TIMEOUT_MS: "${ORBIT_NUMERICAL_ORBIT_PROXY_TIMEOUT_MS:-0}"
      # Pinned time data is opt-in and remains local to the mounted config
      # volume. Paths here are container paths, normally /app/config/eop/… .
      ORBIT_EOP_C04_PATH: "${ORBIT_EOP_C04_PATH:-}"
      ORBIT_EOP_C04_SHA256: "${ORBIT_EOP_C04_SHA256:-}"
      ORBIT_EOP_C04_REQUIRE_SHA256: "${ORBIT_EOP_C04_REQUIRE_SHA256:-}"
      ORBIT_EOP_SOURCE: "${ORBIT_EOP_SOURCE:-}"
      ORBIT_EOP_VERSION: "${ORBIT_EOP_VERSION:-}"
      ORBIT_EOP_QUALITY: "${ORBIT_EOP_QUALITY:-}"
      ORBIT_EOP_STRICT: "${ORBIT_EOP_STRICT:-}"
      ORBIT_EOP_ALLOW_EXTRAPOLATION: "${ORBIT_EOP_ALLOW_EXTRAPOLATION:-}"
      ORBIT_EOP_REQUIRED_START: "${ORBIT_EOP_REQUIRED_START:-}"
      ORBIT_EOP_REQUIRED_END: "${ORBIT_EOP_REQUIRED_END:-}"
      # Generic IERS C01 cache used only when no explicit C04 snapshot is
      # configured. It is refreshed by the backend monitor, never by a state
      # transformation, and lives in the mounted mutable data volume.
      ORBIT_EOP_C01_CACHE_PATH: "${ORBIT_EOP_C01_CACHE_PATH:-/app/data/erp/EOP_C01_IAU2000_1846-now.txt}"
      ORBIT_DIAGNOSTICS_MONITOR_INTERVAL_SECONDS: "${ORBIT_DIAGNOSTICS_MONITOR_INTERVAL_SECONDS:-21600}"
      # Optional low-rate, unauthenticated public GitHub Actions monitor for
      # the Built-In Test panel. It is off by default so an offline local
      # deployment makes no GitHub request.
      ORBIT_GITHUB_ACTIONS_MONITOR: "${ORBIT_GITHUB_ACTIONS_MONITOR:-false}"
      ORBIT_GITHUB_REPOSITORY: "${ORBIT_GITHUB_REPOSITORY:-gabgarar/Orbit}"
      # A pinned IERS EOC Bulletin C 72 snapshot.  This is deliberately local:
      # ECI never contacts IERS/NTP at runtime and fails closed at its #@
      # horizon.  Override the path, SHA and version together when updating.
      ORBIT_LEAP_SECONDS_PATH: "${ORBIT_LEAP_SECONDS_PATH:-/app/config/eop/leap-seconds.list}"
      ORBIT_LEAP_SECONDS_SHA256: "${ORBIT_LEAP_SECONDS_SHA256:-db5a895f16853b03bfc865e8d68f9fc8710ef1740e3400c701cd46a5bbbc3433}"
      ORBIT_LEAP_SECONDS_SOURCE: "${ORBIT_LEAP_SECONDS_SOURCE:-IERS Earth Orientation Center leap-seconds.list}"
      ORBIT_LEAP_SECONDS_VERSION: "${ORBIT_LEAP_SECONDS_VERSION:-IERS-Bulletin-C-72-2026-07-06}"
      ORBIT_LEAP_SECONDS_REQUIRED: "${ORBIT_LEAP_SECONDS_REQUIRED:-true}"
      ORBIT_LEAP_SECONDS_REQUIRE_UNEXPIRED: "${ORBIT_LEAP_SECONDS_REQUIRE_UNEXPIRED:-true}"
      # Precise GNSS SP3 products from the current IGS20 family (IGS20,
      # IGb20 and IGc20) publish a zero-parameter satellite-orbit datum
      # relationship to ITRF2020.  Make that audited, satellite-only route
      # available in the default local deployment so an SP3 accompanied by
      # its ERP is actually renderable and convertible to EME2000.  An
      # operator can still set the family flag to `false` to disable it.
      ORBIT_TERRESTRIAL_REALIZATION: "${ORBIT_TERRESTRIAL_REALIZATION:-ITRF2020}"
      ORBIT_ENABLE_IGS20_ITRF2020_ALIGNMENT: "${ORBIT_ENABLE_IGS20_ITRF2020_ALIGNMENT:-}"
      # Explicit opt-in for the current IGS20/IGb20/IGc20 satellite-frame
      # family. It requires ORBIT_TERRESTRIAL_REALIZATION=ITRF2020.
      ORBIT_ENABLE_IGS20_FAMILY_ITRF2020_ALIGNMENT: "${ORBIT_ENABLE_IGS20_FAMILY_ITRF2020_ALIGNMENT:-true}"
      # Optional local ICGEM gravity field for Cowell's configurable
      # degree/order geopotential.  Set the path, SHA-256 and provenance
      # together; the backend refuses a configured field without its digest.
      # The file stays under the mounted ./config volume and is never fetched
      # by the running service.
      ORBIT_GRAVITY_FIELD_PATH: "${ORBIT_GRAVITY_FIELD_PATH:-}"
      ORBIT_GRAVITY_FIELD_SHA256: "${ORBIT_GRAVITY_FIELD_SHA256:-}"
      ORBIT_GRAVITY_FIELD_SOURCE: "${ORBIT_GRAVITY_FIELD_SOURCE:-}"
      ORBIT_GRAVITY_FIELD_VERSION: "${ORBIT_GRAVITY_FIELD_VERSION:-}"
      # Official NGA EGM archives are a separately validated, mutable cache.
      # The health monitor refreshes it outside force evaluation, so starting
      # Orbit never blocks on a large network download. EGM2008 is selected
      # by default; its effective N×M selection is read from the validated
      # decompressed archive rather than assumed from this configuration.
      ORBIT_GRAVITY_CACHE_DIR: "${ORBIT_GRAVITY_CACHE_DIR:-/app/data/geopotential}"
      ORBIT_GRAVITY_MODEL: "${ORBIT_GRAVITY_MODEL:-EGM2008}"
      ORBIT_GRAVITY_REFRESH_DAYS: "${ORBIT_GRAVITY_REFRESH_DAYS:-30}"
      ORBIT_GRAVITY_AUTO_DOWNLOAD: "${ORBIT_GRAVITY_AUTO_DOWNLOAD:-true}"
      ORBIT_GRAVITY_DOWNLOAD_TIMEOUT_SECONDS: "${ORBIT_GRAVITY_DOWNLOAD_TIMEOUT_SECONDS:-45}"
    volumes:
      # Conserva cambios de configuración y catálogos fuera de la imagen.
      - ./config:/app/config
      # Downloaded C01 is mutable operational cache, not an image layer.
      - ./data:/app/data
    restart: unless-stopped
    init: true
