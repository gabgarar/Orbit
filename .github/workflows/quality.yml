name: Verify Orbit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, build and static audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix react-ui

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Run contract and unit tests
        run: |
          npm run test:node --prefix server
          npm run test:frontend --prefix server
          python -m pytest server/python/tests

      - name: Build React distribution
        run: npm run test:react-build --prefix server

      - name: Audit unused code
        run: |
          (cd server && npx knip)
          (cd server && npx knip --directory ../react-ui)
          (cd server && npx knip --directory ../front)
          npx --prefix server eslint front react-ui/src server/src server/tests --ext .js,.jsx
          python -m ruff check server/python/orbit_api --select F401,F841
          python -m vulture server/python/orbit_api --min-confidence 80
