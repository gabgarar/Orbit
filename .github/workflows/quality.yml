name: Orbit quality

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch makes an older validation run obsolete.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: JavaScript tests and Orbit Tracker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-ui/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix react-ui

      - name: Run Node.js unit tests
        run: npm run test:node --prefix server

      - name: Run frontend unit tests
        run: npm run test:frontend --prefix server

      - name: Build Orbit Tracker
        run: npm run test:react-build --prefix server

  orbital-validation:
    name: Orbital mathematics, SP3/ERP and propagators
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Validate frame mathematics and temporal conversions
        run: |
          python -m pytest -q \
            server/python/tests/frames/test_contract.py \
            server/python/tests/frames/test_configuration.py \
            server/python/tests/frames/test_realizations.py \
            server/python/tests/application/test_precise_eci_safety.py \
            server/python/tests/timekeeping/test_scales.py

      - name: Validate SP3 interpolation and ERP products
        run: |
          python -m pytest -q \
            server/python/tests/formats/test_sp3.py \
            server/python/tests/formats/test_sp3_states.py \
            server/python/tests/timekeeping/test_eop.py \
            server/python/tests/application/test_precise_products.py \
            server/python/tests/api/routes/test_precise_products_route.py

      - name: Validate SGP4, Cowell and RK4 propagators
        run: |
          python -m pytest -q \
            server/python/tests/orbits/propagators/sgp4/test_propagator.py \
            server/python/tests/orbits/propagators/test_cowell.py \
            server/python/tests/application/test_manual_orbits.py \
            server/python/tests/application/test_orbit_parameters.py

      - name: Run complete Python regression suite
        run: python -m pytest -q server/python/tests

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-ui/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install static-analysis dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix react-ui
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Detect unused JavaScript code
        run: |
          (cd server && npx knip)
          (cd server && npx knip --directory ../react-ui)
          (cd server && npx knip --directory ../front)

      - name: Lint JavaScript
        run: npx --prefix server eslint front react-ui/src server/src server/tests --ext .js,.jsx

      - name: Check unused Python imports and code
        run: |
          python -m ruff check server/python/orbit_api --select F401,F841
          python -m vulture server/python/orbit_api --min-confidence 80
