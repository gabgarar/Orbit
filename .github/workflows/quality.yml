name: Orbit quality

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch makes an older validation run obsolete.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: JavaScript contracts, MTR and Orbit Tracker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-ui/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          node --version
          npm --version
          npm ci --prefix server
          npm ci --prefix react-ui

      - name: Run Node.js unit and deployment-contract tests
        run: npm run test:node --prefix server

      - name: Run frontend, ERP and Master Time Range contract tests
        run: npm run test:frontend --prefix server

      - name: Build Orbit Tracker
        run: npm run test:react-build --prefix server

  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build documentation and validate local pages and links
        run: |
          python -m mkdocs build --strict
          test -f site/index.html
          test -f site/en/index.html

  orbital-validation:
    name: Orbital mathematics, SP3/ERP and propagators
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt -r server/requirements-dev.txt

      - name: Validate ITRF/ECI, EOP/ERP and time-scale contracts
        run: |
          python -m pytest -q \
            server/python/tests/frames/test_contract.py \
            server/python/tests/frames/test_configuration.py \
            server/python/tests/frames/test_realizations.py \
            server/python/tests/frames/test_erfa_differential.py \
            server/python/tests/frames/test_transform_invariants.py \
            server/python/tests/application/test_precise_eci_safety.py \
            server/python/tests/application/test_manual_erp.py \
            server/python/tests/timekeeping/test_eop.py \
            server/python/tests/timekeeping/test_iers_eop_cache.py \
            server/python/tests/timekeeping/test_igs_erp_safety.py \
            server/python/tests/timekeeping/test_bundled_leap_second_snapshot.py \
            server/python/tests/timekeeping/test_scales.py \
            server/python/tests/application/test_diagnostics.py \
            server/python/tests/bootstrap/test_bootstrap.py \
            server/python/tests/api/routes/test_routers.py

      - name: Validate SP3/OEM parsing, interpolation and precise-product imports
        run: |
          python -m pytest -q \
            server/python/tests/formats/test_sp3.py \
            server/python/tests/formats/test_sp3_states.py \
            server/python/tests/formats/test_sp3_strict_validation.py \
            server/python/tests/formats/test_oem.py \
            server/python/tests/formats/test_oem_states.py \
            server/python/tests/application/test_precise_products.py \
            server/python/tests/application/test_precise_product_e2e.py \
            server/python/tests/application/test_precise_product_import_fuzzing.py \
            server/python/tests/api/routes/test_precise_products_route.py

      - name: Validate Kepler, SGP4, Cowell/RK4 and physical force models
        run: |
          python -m pytest -q \
            server/python/tests/orbits/propagators/sgp4/test_propagator.py \
            server/python/tests/orbits/propagators/test_cowell.py \
            server/python/tests/orbits/propagators/test_cowell_physical_forces.py \
            server/python/tests/orbits/propagators/test_propagation_invariants.py \
            server/python/tests/orbits/forces/test_force_configuration.py \
            server/python/tests/orbits/forces/test_geopotential.py \
            server/python/tests/orbits/forces/test_celestial.py \
            server/python/tests/application/test_manual_orbits.py \
            server/python/tests/application/test_orbit_parameters.py

      - name: Run complete Python regression suite
        # Keep push/PR validation reproducible: public reference data is only
        # fetched by the manually dispatched real-data workflow.
        env:
          ORBIT_RUN_REAL_DATA: "0"
          ORBIT_DOWNLOAD_REAL_DATA: "0"
          ORBIT_RUN_REAL_DATA_PERFORMANCE: "0"
        run: python -m pytest -q server/python/tests

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            react-ui/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install static-analysis dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix react-ui
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Detect unused JavaScript code
        run: |
          (cd server && npx knip)
          (cd server && npx knip --directory ../react-ui)
          (cd server && npx knip --directory ../front)

      - name: Lint JavaScript
        run: npx --prefix server eslint front react-ui/src server/src server/tests --ext .js,.jsx

      - name: Check unused Python imports and code
        run: |
          python -m ruff check server/python/orbit_api --select F401,F841
          python -m vulture server/python/orbit_api --min-confidence 80
