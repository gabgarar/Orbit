  - search:
      lang:
        - es
        - en

# Treat the documentation tree as an integrity boundary.  `mkdocs build
# --strict` promotes these diagnostics to failures in local and CI builds, so a
# navigation entry, page link, or fragment cannot silently disappear from the
# published site.  External URLs are intentionally not fetched: their
# availability is outside the reproducible documentation build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/shortcuts.js
  - assets/javascripts/navigation-tree.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/navigation.css

