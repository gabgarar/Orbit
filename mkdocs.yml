      - Proyectos: user-guide/projects.md
      - Espacio de trabajo: user-guide/workspace.md
      - Capas: user-guide/layers.md
      - Visualización: user-guide/visualization.md
      - Vista 3D: user-guide/three-d-view.md
      - Línea temporal: user-guide/timeline.md
