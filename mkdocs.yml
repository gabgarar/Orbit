site_name: Documentación de Orbit
site_description: Documentación técnica y operacional de Orbit.
site_url: https://gabgarar.github.io/Orbit/
docs_dir: docs/wiki
exclude_docs: |
  analysis/**
  development/**
  engineering/**
  formats/**
  getting-started/**
  integrations/**
  introduction/**
  operations/**
  propagation/**
  reference/**
  source/**
  user-guide/**

theme:
  name: material
  language: es
  features:
    - i18n
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          build: true
          default: true
          nav:
            - Inicio: index.md
            - Introducción: index.md
            - Primeros pasos: gateway.md
            - Guía de usuario: workspace.md
            - Ingeniería: engineering.md
            - Formatos espaciales: orbit-service.md
            - Propagación: propagation.md
            - Análisis: orbit-service.md
            - Integraciones: api.md
            - Operación: gateway.md
            - Guía de desarrollo: internals.md
            - Referencia: internals.md
        - locale: en
          name: English
          build: true
          site_name: Orbit documentation
          site_description: Technical and operational documentation for Orbit.
          nav:
            - Overview: index.md
            - Introduction: index.md
            - Getting started: gateway.md
            - User guide: workspace.md
            - Engineering: engineering.md
            - Space formats: orbit-service.md
            - Propagation: propagation.md
            - Analysis: orbit-service.md
            - Integrations: api.md
            - Operations: gateway.md
            - Development guide: internals.md
            - Reference: internals.md
  - search:
      lang:
        - es
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - Introducción: index.md
  - Primeros pasos: gateway.md
  - Guía de usuario: workspace.md
  - Ingeniería: engineering.md
  - Formatos espaciales: orbit-service.md
  - Propagación: propagation.md
  - Análisis: orbit-service.md
  - Integraciones: api.md
  - Operación: gateway.md
  - Guía de desarrollo: internals.md
  - Referencia: internals.md
