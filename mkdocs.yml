site_name: Documentación de Orbit
site_description: Documentación técnica y operacional de Orbit.
site_url: https://gabgarar.github.io/Orbit/
docs_dir: docs/wiki
exclude_docs: |
  source/**

theme:
  name: material
  language: es
  logo: assets/images/orbit-mark.svg
  favicon: assets/images/orbit-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - i18n
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_name: Orbit documentation
          site_description: Technical and operational documentation for Orbit.
          nav:
            - Home:
                - Overview: index.md
                - Introduction:
                    - Overview: introduction/overview.md
                - Getting started:
                    - Installation: getting-started/installation.md
                    - Requirements: getting-started/requirements.md
                    - Quick start: getting-started/quick-start.md
                - User guide:
                    - Overview: user-guide/index.md
                    - Projects: user-guide/projects.md
                    - Workspace: user-guide/workspace.md
                    - Workspace concepts: workspace.md
                    - Layers: user-guide/layers.md
                    - Visualisation: user-guide/visualization.md
                    - 3D view: user-guide/three-d-view.md
                    - Timeline: user-guide/timeline.md
                    - Ground stations: user-guide/ground-stations.md
                    - Import: user-guide/import.md
                    - Export: user-guide/export.md
            - Engineering:
                - Overview: engineering/index.md
                - Cartesian states: engineering/cartesian-states.md
                - Keplerian elements: engineering/keplerian-elements.md
                - Equinoctial elements: engineering/equinoctial-elements.md
                - Orbit representations: engineering/orbit-representations.md
                - Reference frames: engineering/reference-frames.md
                - Time, EOP and ITRF: time.md
                - Time systems: engineering/time-systems.md
                - Coordinate systems: engineering/coordinate-systems.md
                - Earth models: engineering/earth-models.md
                - Gravity models: engineering/gravity-models.md
                - Atmospheric models: engineering/atmospheric-models.md
            - Space formats:
                - Overview: formats/index.md
                - Availability matrix: formats/overview.md
                - Ephemerides and interpolation: orbit-service.md
                - TLE: formats/tle.md
                - OMM: formats/omm.md
                - OEM: formats/oem.md
                - OPM: formats/opm.md
                - SP3: formats/sp3.md
                - CPF: formats/cpf.md
                - RINEX: formats/rinex.md
                - Unsupported formats: formats/unsupported-formats.md
            - Propagation:
                - Overview: propagation/index.md
                - Propagators: propagation/overview.md
                - SGP4: propagation/sgp4.md
                - Two body: propagation/two-body.md
                - Cowell:
                    - Overview: propagation/cowell.md
                    - Input and forces: propagation/cowell/input-and-forces.md
                    - Integration and cache: propagation/cowell/integration.md
                    - Output and provenance: propagation/cowell/output.md
                    - Failures and limits: propagation/cowell/limits.md
                - Numerical integrators: propagation/numerical-integrators.md
                - Force models:
                    - Overview: propagation/force-models.md
                    - Point mass: propagation/point-mass.md
                    - J2: propagation/j2.md
                    - J3: propagation/j3.md
                    - J4: propagation/j4.md
                    - Full geopotential: propagation/full-geopotential.md
                    - Third bodies: propagation/third-bodies.md
                    - Atmospheric drag: propagation/atmospheric-drag.md
                    - Solar radiation pressure: propagation/solar-radiation-pressure.md
                    - Relativity: propagation/relativity.md
                - Future dynamics:
                    - Attitude: propagation/attitude.md
                    - Resonances: propagation/resonances.md
            - Analysis:
                - Overview: analysis/index.md
                - Analysis scope: analysis/overview.md
                - Propagator comparison: analysis/comparison-tools.md
                - Plots: analysis/plots.md
                - Statistics: analysis/statistics.md
                - Events: analysis/events.md
                - Measurements: analysis/measurements.md
                - Tracking: analysis/tracking.md
                - Orbit determination: analysis/orbit-determination.md
            - Integrations:
                - Overview: integrations/index.md
                - REST API:
                    - Overview: integrations/rest-api.md
                    - System, configuration and catalogue: integrations/rest-api/system-and-catalog.md
                    - Propagation and ephemerides: integrations/rest-api/orbit-operations.md
                    - Ground stations: integrations/rest-api/ground-stations.md
                    - Export: integrations/rest-api/exports.md
                    - Backend boundary: integrations/rest-api/backend-boundary.md
                - Gateway concepts: gateway.md
                - API concepts: api.md
                - WebSocket: integrations/websocket.md
                - OpenAPI: integrations/openapi.md
                - Python SDK: integrations/python-sdk.md
                - CLI: integrations/cli.md
                - Plugins: integrations/plugins.md
            - Operations:
                - Overview: operations/index.md
                - Configuration: operations/configuration.md
                - Time, EOP and ITRF:
                    - Overview: operations/time-eop.md
                    - Local files: operations/time-eop/data-files.md
                    - Strict mode: operations/time-eop/strict-mode.md
                    - Realisations and visual mode: operations/time-eop/realizations.md
                    - Controlled update: operations/time-eop/updates.md
                - Performance: operations/performance.md
                - Validation: operations/validation.md
                - Frequently asked questions: operations/faq.md
            - Development guide:
                - Overview: development/index.md
                - Architecture: development/architecture.md
                - Tests: development/testing.md
                - Deployment: development/deployment.md
                - Contributing: development/contributing.md
                - Development validation: development/validation.md
            - Reference:
                - Overview: reference/index.md
                - Glossary: reference/glossary.md
                - Bibliography: reference/bibliography.md
                - Appendix: reference/appendix.md
                - Documentation roadmap: reference/roadmap.md
                - Release notes: reference/release-notes.md
                - Internals overview: internals.md
  - search:
      lang:
        - es
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/shortcuts.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/navigation.css

