site_name: Documentación de Orbit
site_description: Documentación técnica y operacional de Orbit.
site_url: https://gabgarar.github.io/Orbit/
docs_dir: docs/wiki
exclude_docs: |
  source/**

theme:
  name: material
  custom_dir: docs/wiki/overrides
  language: es
  logo: assets/images/orbit-mark.svg
  favicon: assets/images/orbit-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - i18n
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          build: true
          default: true
        - locale: en
          name: English
          build: true
          site_name: Orbit documentation
          site_description: Technical and operational documentation for Orbit.
          nav:
            - Home:
                - Overview: index.md
                - Introduction:
                    - Overview: introduction/overview.md
                - Getting started:
                    - Installation: getting-started/installation.md
                    - Requirements: getting-started/requirements.md
                    - Quick start: getting-started/quick-start.md
            - Satellite:
                - Overview: satellite/index.md
                - Space formats:
                    - Overview: formats/index.md
                    - Availability matrix: formats/overview.md
                    - Orbital formats:
                        - Overview: formats/orbital/index.md
                        - TLE: formats/tle.md
                        - OMM: formats/omm.md
                        - OEM: formats/oem.md
                        - OPM: formats/opm.md
                        - SP3: formats/sp3.md
                        - Precise GNSS products: formats/precise-products.md
                    - Unsupported formats: formats/unsupported-formats.md
                - Orbit design and catalogue:
                    - Manual orbits: user-guide/manual-orbits.md
                    - Ephemerides and interpolation: orbit-service.md
                    - Catalogue and sources: integrations/rest-api/system-and-catalog.md
                    - Orbit operations: integrations/rest-api/orbit-operations.md
                - Propagation:
                    - Overview: propagation/index.md
                    - Propagators:
                        - Overview: propagation/overview.md
                        - SGP4:
                            - Overview: propagation/sgp4.md
                            - TLE and state contract: propagation/sgp4/tle-and-contract.md
                            - Time and frames: propagation/sgp4/time-and-frames.md
                            - Recommended use and limits: propagation/sgp4/validity-and-use.md
                        - Two body:
                            - Overview: propagation/two-body.md
                            - Keplerian elements and motion: propagation/two-body/keplerian-motion.md
                            - Time and frames: propagation/two-body/time-and-frames.md
                            - Output and frames: propagation/two-body/frames-output.md
                            - Recommended use and limits: propagation/two-body/recommended-use.md
                        - Cowell:
                            - Overview: propagation/cowell.md
                            - Input and forces: propagation/cowell/input-and-forces.md
                            - Integration and cache: propagation/cowell/integration.md
                            - Time and frames: propagation/cowell/time-and-frames.md
                            - Output and provenance: propagation/cowell/output.md
                            - Recommended use: propagation/cowell/recommended-use.md
                            - Failures and limits: propagation/cowell/limits.md
                    - Numerical integrators:
                        - Overview: propagation/numerical-integrators.md
                        - RK4: propagation/rk4.md
                    - Force models:
                        - Overview: propagation/force-models.md
                        - Gravitational:
                            - Kepler / central gravity: propagation/point-mass.md
                            - Geopotential:
                                - J2: propagation/j2.md
                                - J3: propagation/j3.md
                                - J4: propagation/j4.md
                                - Full geopotential: propagation/full-geopotential.md
                            - Lunisolar perturbations: propagation/third-bodies.md
                            - Tides: propagation/tides.md
                        - Non-gravitational:
                            - Atmospheric drag: propagation/atmospheric-drag.md
                            - Solar radiation pressure: propagation/solar-radiation-pressure.md
                            - Albedo: propagation/albedo.md
